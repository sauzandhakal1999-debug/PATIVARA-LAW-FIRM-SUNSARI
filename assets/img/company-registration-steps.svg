<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="auto" aria-labelledby="corpSvgTitle corpSvgDesc" role="img">
  <title id="corpSvgTitle">Company Incorporation Workflow in Nepal</title>
  <desc id="corpSvgDesc">Step-by-step corporate registration at Office of the Company Registrar under Companies Act 2063.</desc>
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #0d1b2a; stroke-width: 2; rx: 6px; }
      .box-active { fill: #0d1b2a; stroke: #c59b27; stroke-width: 2; rx: 6px; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: bold; fill: #0d1b2a; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #64748b; }
      .text-title-active { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: bold; fill: #c59b27; }
      .text-sub-active { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #f8fafc; }
      .step-num { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 800; fill: #c59b27; }
      .arrow { stroke: #c59b27; stroke-width: 2; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#c59b27" />
    </marker>
  </defs>

  <rect x="20" y="40" width="190" height="150" class="box" />
  <text x="35" y="65" class="step-num">PHASE 01</text>
  <text x="35" y="90" class="text-title">Name Reservation</text>
  <text x="35" y="108" class="text-sub">कम्पनीको नाम स्वीकृति</text>
  <text x="35" y="135" class="text-sub">Electronic name search &amp;</text>
  <text x="35" y="152" class="text-sub">reservation portal approval at</text>
  <text x="35" y="169" class="text-sub">Office of Company Registrar (OCR).</text>

  <line x1="210" y1="115" x2="240" y2="115" class="arrow" />

  <rect x="240" y="40" width="190" height="150" class="box" />
  <text x="255" y="65" class="step-num">PHASE 02</text>
  <text x="255" y="90" class="text-title">MOA &amp; AOA Drafting</text>
  <text x="255" y="108" class="text-sub">प्रबन्धपत्र र नियमावली</text>
  <text x="255" y="135" class="text-sub">Advocate formulation of</text>
  <text x="255" y="152" class="text-sub">Memorandum &amp; Articles,</text>
  <text x="255" y="169" class="text-sub">share capital &amp; objectives.</text>

  <line x1="430" y1="115" x2="460" y2="115" class="arrow" />

  <rect x="460" y="40" width="190" height="150" class="box" />
  <text x="475" y="65" class="step-num">PHASE 03</text>
  <text x="475" y="90" class="text-title">OCR Filing &amp; Approval</text>
  <text x="475" y="108" class="text-sub">कम्पनी दर्ता प्रमाणपत्र</text>
  <text x="475" y="135" class="text-sub">Submission of promoter</text>
  <text x="475" y="152" class="text-sub">agreements, statutory fees &amp;</text>
  <text x="475" y="169" class="text-sub">issuance of Certificate.</text>

  <line x1="650" y1="115" x2="680" y2="115" class="arrow" />

  <rect x="680" y="40" width="195" height="150" class="box-active" />
  <text x="695" y="65" class="step-num">PHASE 04</text>
  <text x="695" y="90" class="text-title-active">PAN, Ward &amp; Banking</text>
  <text x="695" y="108" class="text-sub-active">प्यान, वडा र बैंक खाता</text>
  <text x="695" y="135" class="text-sub-active">Inland Revenue PAN/VAT,</text>
  <text x="695" y="152" class="text-sub-active">Local Ward business license &amp;</text>
  <text x="695" y="169" class="text-sub-active">corporate bank account opening.</text>
</svg>
