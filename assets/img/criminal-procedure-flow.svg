<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="auto" aria-labelledby="crimSvgTitle crimSvgDesc" role="img">
  <title id="crimSvgTitle">Criminal Procedure Workflow in Nepal</title>
  <desc id="crimSvgDesc">Diagram illustrating stages under the Muluki Criminal Procedure Code 2074 from First Information Report to Bail and Trial.</desc>
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #0d1b2a; stroke-width: 2; rx: 6px; }
      .box-active { fill: #0d1b2a; stroke: #c59b27; stroke-width: 2; rx: 6px; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: bold; fill: #0d1b2a; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #64748b; }
      .text-title-active { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: bold; fill: #c59b27; }
      .text-sub-active { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #f8fafc; }
      .step-num { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 800; fill: #c59b27; }
      .arrow { stroke: #c59b27; stroke-width: 2; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#c59b27" />
    </marker>
  </defs>

  <rect x="20" y="40" width="125" height="150" class="box" />
  <text x="35" y="65" class="step-num">STAGE 01</text>
  <text x="35" y="90" class="text-title">FIR / Complaint</text>
  <text x="35" y="108" class="text-sub">जाहेरी दरखास्त</text>
  <text x="35" y="135" class="text-sub">Lodging report at</text>
  <text x="35" y="152" class="text-sub">police station or</text>
  <text x="35" y="169" class="text-sub">prosecutor office</text>

  <line x1="145" y1="115" x2="165" y2="115" class="arrow" />

  <rect x="165" y="40" width="125" height="150" class="box" />
  <text x="180" y="65" class="step-num">STAGE 02</text>
  <text x="180" y="90" class="text-title">Police Custody</text>
  <text x="180" y="108" class="text-sub">प्रहरी हिरासत</text>
  <text x="180" y="135" class="text-sub">Production before</text>
  <text x="180" y="152" class="text-sub">court within 24 hrs</text>
  <text x="180" y="169" class="text-sub">(Art. 20 rights)</text>

  <line x1="290" y1="115" x2="310" y2="115" class="arrow" />

  <rect x="310" y="40" width="125" height="150" class="box" />
  <text x="325" y="65" class="step-num">STAGE 03</text>
  <text x="325" y="90" class="text-title">Remand / Inquiry</text>
  <text x="325" y="108" class="text-sub">म्याद थप अनुसन्धान</text>
  <text x="325" y="135" class="text-sub">Judicial permission</text>
  <text x="325" y="152" class="text-sub">for investigation</text>
  <text x="325" y="169" class="text-sub">&amp; statement records</text>

  <line x1="435" y1="115" x2="455" y2="115" class="arrow" />

  <rect x="455" y="40" width="125" height="150" class="box" />
  <text x="470" y="65" class="step-num">STAGE 04</text>
  <text x="470" y="90" class="text-title">Charge Sheet</text>
  <text x="470" y="108" class="text-sub">अभियोगपत्र दर्ता</text>
  <text x="470" y="135" class="text-sub">Government attorney</text>
  <text x="470" y="152" class="text-sub">files formal charges</text>
  <text x="470" y="169" class="text-sub">in District Court</text>

  <line x1="580" y1="115" x2="600" y2="115" class="arrow" />

  <rect x="600" y="40" width="125" height="150" class="box-active" />
  <text x="615" y="65" class="step-num">STAGE 05</text>
  <text x="615" y="90" class="text-title-active">Bail Hearing</text>
  <text x="615" y="108" class="text-sub-active">थुनछेक र धरौटी</text>
  <text x="615" y="135" class="text-sub-active">Sec. 67/68 hearing:</text>
  <text x="615" y="152" class="text-sub-active">bail, ordinary surety,</text>
  <text x="615" y="169" class="text-sub-active">or judicial remand</text>

  <line x1="725" y1="115" x2="745" y2="115" class="arrow" />

  <rect x="745" y="40" width="135" height="150" class="box" />
  <text x="760" y="65" class="step-num">STAGE 06</text>
  <text x="760" y="90" class="text-title">Trial &amp; Verdict</text>
  <text x="760" y="108" class="text-sub">मुद्दा पुर्पक्ष र फैसला</text>
  <text x="760" y="135" class="text-sub">Full witness trial,</text>
  <text x="760" y="152" class="text-sub">defence arguments</text>
  <text x="760" y="169" class="text-sub">&amp; judicial judgment</text>
</svg>
