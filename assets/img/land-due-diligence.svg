<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="auto" aria-labelledby="landSvgTitle landSvgDesc" role="img">
  <title id="landSvgTitle">Land Due Diligence & Transfer Workflow in Nepal</title>
  <desc id="landSvgDesc">Key verification and registration stages for property acquisition in Nepal.</desc>
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #0d1b2a; stroke-width: 2; rx: 6px; }
      .box-active { fill: #0d1b2a; stroke: #c59b27; stroke-width: 2; rx: 6px; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: bold; fill: #0d1b2a; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #64748b; }
      .text-title-active { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: bold; fill: #c59b27; }
      .text-sub-active { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #f8fafc; }
      .step-num { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 800; fill: #c59b27; }
      .arrow { stroke: #c59b27; stroke-width: 2; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#c59b27" />
    </marker>
  </defs>

  <rect x="20" y="40" width="190" height="150" class="box" />
  <text x="35" y="65" class="step-num">STEP 01</text>
  <text x="35" y="90" class="text-title">Title &amp; Lalpurja Check</text>
  <text x="35" y="108" class="text-sub">लालपुर्जा र मोठ श्रेस्ता</text>
  <text x="35" y="135" class="text-sub">Inspect original ownership deed</text>
  <text x="35" y="152" class="text-sub">against Land Revenue (Malpot)</text>
  <text x="35" y="169" class="text-sub">records and Cadastral Map (Napi).</text>

  <line x1="210" y1="115" x2="240" y2="115" class="arrow" />

  <rect x="240" y="40" width="190" height="150" class="box" />
  <text x="255" y="65" class="step-num">STEP 02</text>
  <text x="255" y="90" class="text-title">Encumbrance &amp; Rokka</text>
  <text x="255" y="108" class="text-sub">रोक्का तथा धितो खोजी</text>
  <text x="255" y="135" class="text-sub">Verify absence of bank liens,</text>
  <text x="255" y="152" class="text-sub">court injunctions, tax freezes,</text>
  <text x="255" y="169" class="text-sub">or registered tenant (Mohi) rights.</text>

  <line x1="430" y1="115" x2="460" y2="115" class="arrow" />

  <rect x="460" y="40" width="190" height="150" class="box" />
  <text x="475" y="65" class="step-num">STEP 03</text>
  <text x="475" y="90" class="text-title">Ward Recommendation</text>
  <text x="475" y="108" class="text-sub">घर बाटो सिफारिस र कर</text>
  <text x="475" y="135" class="text-sub">Obtain municipal road access</text>
  <text x="475" y="152" class="text-sub">verification (Ghar Bato Sifaris)</text>
  <text x="475" y="169" class="text-sub">&amp; property tax clearance.</text>

  <line x1="650" y1="115" x2="680" y2="115" class="arrow" />

  <rect x="680" y="40" width="195" height="150" class="box-active" />
  <text x="695" y="65" class="step-num">STEP 04</text>
  <text x="695" y="90" class="text-title-active">Rajinama Deed Transfer</text>
  <text x="695" y="108" class="text-sub-active">राजीनामा लिखत पारित</text>
  <text x="695" y="135" class="text-sub-active">Execution of sale agreement,</text>
  <text x="695" y="152" class="text-sub-active">payment of registration fees &amp;</text>
  <text x="695" y="169" class="text-sub-active">issuance of new Lalpurja.</text>
</svg>
