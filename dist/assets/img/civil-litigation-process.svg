<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="auto" aria-labelledby="civilSvgTitle civilSvgDesc" role="img">
  <title id="civilSvgTitle">Civil Litigation Procedural Stages in Nepal</title>
  <desc id="civilSvgDesc">Flowchart depicting the procedural stages of a civil lawsuit under the Muluki Civil Procedure Code 2074 from Plaint to Decree Execution.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .box { fill: #ffffff; stroke: #0d1b2a; stroke-width: 2; rx: 6px; }
      .box-active { fill: #0d1b2a; stroke: #c59b27; stroke-width: 2; rx: 6px; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: bold; fill: #0d1b2a; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #64748b; }
      .text-title-active { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: bold; fill: #c59b27; }
      .text-sub-active { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #f8fafc; }
      .step-num { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 800; fill: #c59b27; }
      .arrow { stroke: #c59b27; stroke-width: 2; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#c59b27" />
    </marker>
  </defs>

  <rect x="20" y="40" width="125" height="150" class="box" />
  <text x="35" y="65" class="step-num">STAGE 01</text>
  <text x="35" y="90" class="text-title">Plaint Filing</text>
  <text x="35" y="108" class="text-sub">फिरादपत्र दर्ता</text>
  <text x="35" y="135" class="text-sub">Filing at District</text>
  <text x="35" y="152" class="text-sub">Court with fees</text>
  <text x="35" y="169" class="text-sub">&amp; exhibits</text>

  <line x1="145" y1="115" x2="165" y2="115" class="arrow" />

  <rect x="165" y="40" width="125" height="150" class="box" />
  <text x="180" y="65" class="step-num">STAGE 02</text>
  <text x="180" y="90" class="text-title">Court Notice</text>
  <text x="180" y="108" class="text-sub">म्याद तामेली</text>
  <text x="180" y="135" class="text-sub">Formal summons</text>
  <text x="180" y="152" class="text-sub">served to defendant</text>
  <text x="180" y="169" class="text-sub">(21-day timeline)</text>

  <line x1="290" y1="115" x2="310" y2="115" class="arrow" />

  <rect x="310" y="40" width="125" height="150" class="box" />
  <text x="325" y="65" class="step-num">STAGE 03</text>
  <text x="325" y="90" class="text-title">Defence Reply</text>
  <text x="325" y="108" class="text-sub">प्रतिउत्तरपत्र</text>
  <text x="325" y="135" class="text-sub">Written defence,</text>
  <text x="325" y="152" class="text-sub">counter-claims &amp;</text>
  <text x="325" y="169" class="text-sub">rebuttal exhibits</text>

  <line x1="435" y1="115" x2="455" y2="115" class="arrow" />

  <rect x="455" y="40" width="125" height="150" class="box" />
  <text x="470" y="65" class="step-num">STAGE 04</text>
  <text x="470" y="90" class="text-title">Evidence Test</text>
  <text x="470" y="108" class="text-sub">प्रमाण परीक्षण</text>
  <text x="470" y="135" class="text-sub">Witness testimony,</text>
  <text x="470" y="152" class="text-sub">cross-examination</text>
  <text x="470" y="169" class="text-sub">&amp; record check</text>

  <line x1="580" y1="115" x2="600" y2="115" class="arrow" />

  <rect x="600" y="40" width="125" height="150" class="box" />
  <text x="615" y="65" class="step-num">STAGE 05</text>
  <text x="615" y="90" class="text-title">Final Arguments</text>
  <text x="615" y="108" class="text-sub">बहस र फैसला</text>
  <text x="615" y="135" class="text-sub">Advocate advocacy</text>
  <text x="615" y="152" class="text-sub">before the bench &amp;</text>
  <text x="615" y="169" class="text-sub">written verdict</text>

  <line x1="725" y1="115" x2="745" y2="115" class="arrow" />

  <rect x="745" y="40" width="135" height="150" class="box-active" />
  <text x="760" y="65" class="step-num">STAGE 06</text>
  <text x="760" y="90" class="text-title-active">Decree Execution</text>
  <text x="760" y="108" class="text-sub-active">फैसला कार्यान्वयन</text>
  <text x="760" y="135" class="text-sub-active">Enforcing judgment,</text>
  <text x="760" y="152" class="text-sub-active">asset recovery or</text>
  <text x="760" y="169" class="text-sub-active">High Court appeal</text>
</svg>
